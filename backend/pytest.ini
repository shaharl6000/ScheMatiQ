[pytest]
asyncio_mode = auto
testpaths = tests
# Import `app` from backend/ regardless of CWD (tests/conftest.py chdirs away).
pythonpath = .
markers =
    integration: opt-in integration tests (e.g. real SentenceTransformer cold loading)
filterwarnings =
    ignore:builtin type Swig\w* has no __module__ attribute:DeprecationWarning
